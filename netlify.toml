# Netlify configuration — MobileREMS by Longevia
[build]
  publish = "."
  command = ""

# Clean URLs: /technology serves /technology.html
[[redirects]]
  from = "/technology"
  to = "/technology.html"
  status = 200
[[redirects]]
  from = "/who-its-for"
  to = "/who-its-for.html"
  status = 200
[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/research"
  to = "/research.html"
  status = 200
[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
