# Netlify configuration — MobileREMS by Longevia
[build]
  publish = "."
  command = ""

# Clean URLs: /technology serves /technology.html
[[redirects]]
  from = "/technology"
  to = "/technology.html"
  status = 200
[[redirects]]
  from = "/how-rems-works"
  to = "/how-rems-works.html"
  status = 200
[[redirects]]
  from = "/what-to-expect"
  to = "/what-to-expect.html"
  status = 200
[[redirects]]
  from = "/who-its-for"
  to = "/who-its-for.html"
  status = 200
[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/research"
  to = "/research.html"
  status = 200
[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Assets: revalidate every load (filenames are not content-hashed),
# so CSS/JS updates are picked up immediately instead of being cached stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
